name: Android Manual Build

# Parte SOLO manualmente quando premi il bottone "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice del repository
        uses: actions/checkout@v4

      - name: 2. Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTA: nessuno step "setup-android"!
      # I runner ubuntu-latest di GitHub hanno gia' Android SDK
      # (platform 34 + build-tools) preinstallato.

      - name: 3. Installa Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 4. Compila APK di Debug
        run: gradle assembleDebug --stacktrace

      - name: 5. Salva l'APK compilato
        uses: actions/upload-artifact@v4
        with:
          name: UltimateMule-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
