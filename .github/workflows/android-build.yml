name: Compilazione Manuale APK

on:
  workflow_dispatch: # <--- Attiva SOLO su comando manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      
      # Generiamo al volo il wrapper di Gradle (fondamentale se non hai caricato i file di sistema)
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Compila APK Debug
        run: gradle assembleDebug
        
      - name: Carica APK per il Download
        uses: actions/upload-artifact@v4
        with:
          name: UltimateMule-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
